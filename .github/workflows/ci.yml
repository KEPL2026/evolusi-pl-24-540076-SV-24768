name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json
          coverage: none

      - name: Install PHPUnit
        run: |
          composer require --dev phpunit/phpunit:^10.0 --no-interaction --no-plugins --no-scripts -q || true

      - name: Run tests
        run: vendor/bin/phpunit --configuration phpunit.xml || true

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json

      - name: Install PHP CodeSniffer
        run: |
          composer require --dev squizlabs/php_codesniffer:^3.7 --no-interaction --no-plugins --no-scripts -q || true

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --standard=PSR12 app/ || true
