name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        env:
          COMPOSER_NO_AUDIT: 1
          COMPOSER_NO_DEV: 0

      - name: Run tests
        run: composer test

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        env:
          COMPOSER_NO_AUDIT: 1
          COMPOSER_NO_DEV: 0

      - name: Run PHP CodeSniffer
        run: composer lint
